[alembic]
# 1. Indicamos la carpeta física donde viven tus migraciones
script_location = alembic

# 2. Permitimos que Python busque módulos en la raíz
prepend_sys_path = .
version_path_separator = os

# 3. Marcador de posición (tu env.py dinámico se encargará de cambiarlo en Render)
sqlalchemy.url = postgresql://placeholder

# ---------------------------------------------------------------------
# CONFIGURACIÓN DE LOGS (Requerida obligatoriamente por env.py)
# ---------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S