name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout de código
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy

      # 4. Linter con Ruff
      - name: Ejecutar Linter (Ruff)
        run: ruff check .

      # 5. Verificación de tipos con Mypy
      - name: Verificar Tipado (Mypy)
        run: mypy app --ignore-missing-imports

      # 6. Pruebas unitarias con cobertura mínima
      - name: Ejecutar Pruebas (Pytest)
        run: pytest --cov=app --cov-fail-under=80

      # 7. Desplegar automáticamente en Render si todo pasa
      - name: Redeploy en Render
        if: success()
        run: |
          curl -X POST https://api.render.com/v1/services/srv-d9qiikrm8hqs738hlnng/deploys \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Accept: application/json"
