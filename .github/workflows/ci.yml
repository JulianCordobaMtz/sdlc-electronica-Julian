name: CI/CD

on:
  push:
    branches: [main, semana6]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Calidad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Revisar estilo con Ruff
        run: ruff check .

      - name: Revisar tipos con Mypy
        run: mypy app --ignore-missing-imports

      - name: Ejecutar pruebas y cobertura
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  docker:
    name: Construcción Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen sin publicarla
        run: docker build --tag sensorhub:${{ github.sha }} .

  deploy:
    name: Despliegue en Render
    needs: [quality, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - name: Validar configuración de Render
        env:
          RENDER_API_KEY: ${{ secrets.API_KEY_SENSORHUB }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          test -n "$RENDER_API_KEY" || (echo "Falta el secreto RENDER_API_KEY" && exit 1)
          test -n "$RENDER_SERVICE_ID" || (echo "Falta la variable RENDER_SERVICE_ID" && exit 1)

      - name: Desplegar el commit validado
        env:
          RENDER_API_KEY: ${{ secrets.API_KEY_SENSORHUB }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "{\"commitId\":\"${GITHUB_SHA}\"}"
