# Blueprint de Render para SensorHub API
services:
  - type: web
    name: sensorhub-api-julian
    runtime: docker # Render detectará tu Dockerfile automáticamente [6, 7]
    plan: free
    # Comando de arranque oficial exigido por tu guía para aplicar migraciones y levantar la API [8]
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sensorhub-db-julian
          property: connectionString # Conecta la URL de la base de datos de abajo de forma automática [4]

databases:
  - name: sensorhub-db-julian
    plan: free