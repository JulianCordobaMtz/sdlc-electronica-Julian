# Blueprint de Render para SensorHub API
services:
  - type: web
    name: sensorhub-api-julian
    runtime: docker # Render detectará tu Dockerfile automáticamente
    plan: free
    # Envolvemos el comando en sh -c con comillas simples para que interprete el operador '&&'
    dockerCommand: "sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000'"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sensorhub-db-julian
          property: connectionString # Conecta la URL de la base de datos de abajo de forma automática

databases:
  - name: sensorhub-db-julian
    plan: free