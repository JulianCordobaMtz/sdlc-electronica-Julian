# Blueprint de Render para SensorHub API
services:
  - type: web
    name: sensorhub-api-julian
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sensorhub-db-julian
          property: connectionString

databases:
  - name: sensorhub-db-julian
    plan: free
