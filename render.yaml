# Blueprint de Render para SensorHub API
services:
  - type: web
    name: sensorhub-api-julian
    runtime: docker # Render detectará tu Dockerfile y su CMD de forma automática [1]
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sensorhub-db-julian
          property: connectionString # Conecta la base de datos de abajo automáticamente

databases:
  - name: sensorhub-db-julian
    plan: free